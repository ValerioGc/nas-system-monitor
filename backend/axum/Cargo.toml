[package]
name = "nas-system-monitor-axum"
version = "0.9.1"
edition = "2021"
autotests = false

[dependencies]
axum = "0.8.9"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9", default-features = false, features = ["sqlite", "runtime-tokio", "migrate", "macros"] }
tokio = { version = "1.53.3", features = ["fs", "macros", "net", "rt-multi-thread", "signal", "sync"] }

[dev-dependencies]
tokio = { version = "1.53.3", features = ["io-util", "time"] }
